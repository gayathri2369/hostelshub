name: hostelhub
description: "HostelHub - A marketplace app for hostel students to buy and sell items."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Supabase
  supabase_flutter: ^2.8.4

  # Local cache
  shared_preferences: ^2.3.3

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  path: ^1.9.0
  cached_network_image: ^3.4.1
  flutter_staggered_grid_view: ^0.7.0
  badges: ^3.1.2

  # AI / HTTP
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # App launcher icons
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

# ============================================================
# APP ICON CONFIGURATION
# ============================================================

flutter_launcher_icons:
  android: true
  ios: true

  # Your app icon
  image_path: "assets/images/app_icon.png"

  # Android
  min_sdk_android: 21

  # iOS
  remove_alpha_ios: true